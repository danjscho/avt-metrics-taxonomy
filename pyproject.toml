[project]
name = "avt-metrics-taxonomy"
version = "5.0.2"
description = "Healthcare metrics taxonomy for assuring Ambient Voice Technology in NHS and comparable settings"
requires-python = ">=3.10"
dependencies = [
    "mkdocs-material",
    "mike",
    "mkdocs-rss-plugin",
    "mkdocs-redirects>=1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

# This project is documentation + Python tooling, not a distributable package.
# uv reads `dependencies` for environment management; nothing is published to PyPI.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["taxonomy/tests"]
python_files = "test_*.py"
